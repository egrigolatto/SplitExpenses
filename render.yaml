# Render Blueprint — https://docs.render.com/blueprints/
# Source of truth del servicio API. Cualquier cambio en este archivo
# se sincroniza automaticamente al pushear (Render aplica el diff).
#
# Crear el servicio: Render Dashboard -> New -> Blueprint -> repo SplitExpenses (develop)
# Render pedira una vez los valores de las variables con sync:false:
#   DATABASE_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# Las variables con generateValue: las genera Render (random) y las persiste.
services:
  - type: web
    name: split-expenses-api # -> https://split-expenses-api.onrender.com
    runtime: node
    plan: free
    region: oregon # misma region que Supabase us-west-2 (AWS Oregon)
    branch: develop
    rootDir: server
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    # El plan free de Render no soporta preDeployCommand: las migraciones
    # corren aca, idempotentes (si ya estan aplicadas, es un noop).
    # El "exec" hace que node reciba las señales (graceful shutdown).
    startCommand: node scripts/migrate.js && exec node dist/server.js
    healthCheckPath: /health
    autoDeployTrigger: commit # cada push a develop = deploy
    envVars:
      - key: NODE_VERSION
        value: "24" # redundante con server/.nvmrc, explicito para el buildpack
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Supabase shared pooler (session mode, :5432) + "?sslmode=no-verify"
                    # (no "require": con pg 8.x verifica la CA y el cert self-signed de
                    #  Supavisor crashea el arranque con SELF_SIGNED_CERT_IN_CHAIN)
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "604800"
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 30d
      - key: COOKIE_NAME
        value: access_token
      - key: COOKIE_SAME_SITE
        value: "none" # el frontend vive en otro site (web vs api); none fuerza Secure (HTTPS)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://split-expenses-api.onrender.com/api/v1/auth/google/callback
      - key: FRONTEND_URL
        value: https://split-expenses-web.onrender.com # origin permitido por CORS + destino del post-OAuth
      - key: TRUST_PROXY
        value: "1" # Render pone un reverse proxy delante (+1 mas si algun dia hay CDN tipo Cloudflare)

  # SPA del frontend: Render la build y la sirve desde un CDN global.
  # Sin plan/region/startCommand (los static sites no corren un proceso):
  # solo se build el bundle estatico de Vite y se publica dist/.
  # Las rutas desconocidas sirven index.html automaticamente (fallback SPA).
  # VITE_API_URL se embebe en el bundle AL BUILD (no en runtime): es build-time env.
  - type: web
    name: split-expenses-web # -> https://split-expenses-web.onrender.com
    runtime: static
    branch: develop
    rootDir: client
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        value: https://split-expenses-api.onrender.com
